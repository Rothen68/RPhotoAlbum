<div class="scrubber-wrapper">
  <div
    class="scrubber-bar"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (pointercancel)="onPointerUp()"
  >
    <div class="track"></div>
    <div class="thumb" [class.dragging]="dragging()" [style.top.%]="thumbRatio() * 100"></div>

    @if (dragging()) {
      <div class="label" [style.top.%]="thumbRatio() * 100">{{ label() }}</div>
    }
  </div>
</div>
