server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers du service worker Angular : jamais de cache long terme, sinon un navigateur/proxy
    # pourrait continuer à servir un ngsw.json obsolète et bloquer la détection de mise à jour de
    # l'app (le service worker lui-même compare ngsw.json par hash, mais ça suppose de pouvoir en
    # récupérer une version fraîche). Location `=` (correspondance exacte) : prioritaire sur le
    # bloc regex ci-dessous quel que soit l'ordre dans ce fichier.
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fichiers avec hash dans le nom (générés par `ng build`, ex. main-XXXXXXXX.js) : contenu
    # figé pour un build donné, cache long terme sûr.
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (et toute route SPA qui y retombe via try_files) : sans en-tête explicite, les
    # navigateurs appliquent un cache heuristique et peuvent continuer à servir une ancienne
    # page — donc un ancien nom de bundle — bien après un nouveau déploiement. `no-cache` force
    # une revalidation à chaque fois (bon marché grâce à ETag/Last-Modified), sans empêcher la
    # mise en cache elle-même.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
