server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers avec hash dans le nom (générés par `ng build`, ex. main-XXXXXXXX.js) : contenu
    # figé pour un build donné, cache long terme sûr.
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (et toute route SPA qui y retombe via try_files) : sans en-tête explicite, les
    # navigateurs appliquent un cache heuristique et peuvent continuer à servir une ancienne
    # page — donc un ancien nom de bundle — bien après un nouveau déploiement. `no-cache` force
    # une revalidation à chaque fois (bon marché grâce à ETag/Last-Modified), sans empêcher la
    # mise en cache elle-même.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
