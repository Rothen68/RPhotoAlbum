server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular service worker files: never long-term cached, otherwise a browser/proxy could
    # keep serving a stale ngsw.json and block the app's update detection (the service worker
    # itself compares ngsw.json by hash, but that assumes it can fetch a fresh copy). Exact-match
    # `=` location: takes priority over the regex block below regardless of file order.
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Files with a hash in their name (generated by `ng build`, e.g. main-XXXXXXXX.js): content
    # frozen for a given build, safe long-term cache.
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (and any SPA route that falls back to it via try_files): without an explicit
    # header, browsers apply heuristic caching and may keep serving an old page — hence an old
    # bundle name — well after a new deployment. `no-cache` forces revalidation every time
    # (cheap thanks to ETag/Last-Modified), without preventing caching itself.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
