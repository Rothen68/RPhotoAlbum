services:
  backend:
    build: ./backend
    environment:
      ConnectionStrings__Cache: Data Source=/data/cache.db
      PCloud__ClientId: ${PCLOUD_CLIENT_ID}
      PCloud__ClientSecret: ${PCLOUD_CLIENT_SECRET}
      PCloud__RedirectUri: ${PCLOUD_REDIRECT_URI}
      App__BaseUrl: ${APP_BASE_URL}
      App__AuthSecret: ${APP_AUTH_SECRET}
      App__AdminUsername: ${APP_ADMIN_USERNAME}
      App__AdminPasswordHash: ${APP_ADMIN_PASSWORD_HASH}
      Indexing__IntervalMinutes: ${INDEXING_INTERVAL_MINUTES:-15}
      MediaCache__MaxSizeMb: ${MEDIA_CACHE_MAX_SIZE_MB:-1024}
      Logging__LogLevel__Default: ${LOG_LEVEL:-Information}
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "3140:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # Visualiseur de logs Docker en temps réel (tous les conteneurs de l'hôte, pas seulement
  # ceux de cette stack) — accès direct sur le port ci-dessous, protégé par le même
  # périmètre réseau (VPN/LAN) que le reste de l'application, voir ARCHITECTURE.md §2.
  logs:
    image: amir20/dozzle:latest
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Client sqlite3 pour inspecter directement backend-data/cache.db pendant le débogage — sous
  # un profil dédié ("debug") pour ne JAMAIS démarrer avec un simple `docker compose up -d`
  # (donc pas plus de conteneur en prod via deploy.sh, qui n'active aucun profil). Sans danger
  # pour la base en tant que lecteur concurrent : le mode WAL (voir issue #18) autorise
  # explicitement des lectures pendant qu'un writer (le backend) est actif.
  # Usage : docker compose --profile debug up -d sqlite-cli
  #         docker exec -it rphotoalbum-sqlite-cli-1 sqlite3 /data/cache.db
  sqlite-cli:
    image: alpine:3.20
    profiles: ["debug"]
    command: sh -c "apk add --no-cache sqlite && tail -f /dev/null"
    volumes:
      - backend-data:/data
    restart: unless-stopped

volumes:
  backend-data:
