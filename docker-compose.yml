services:
  backend:
    build: ./backend
    environment:
      ConnectionStrings__Cache: Data Source=/data/cache.db
      PCloud__ClientId: ${PCLOUD_CLIENT_ID}
      PCloud__ClientSecret: ${PCLOUD_CLIENT_SECRET}
      PCloud__RedirectUri: ${PCLOUD_REDIRECT_URI}
      App__BaseUrl: ${APP_BASE_URL}
      App__AuthSecret: ${APP_AUTH_SECRET}
      App__AdminUsername: ${APP_ADMIN_USERNAME}
      App__AdminPasswordHash: ${APP_ADMIN_PASSWORD_HASH}
      Indexing__IntervalMinutes: ${INDEXING_INTERVAL_MINUTES:-15}
      MediaCache__MaxSizeMb: ${MEDIA_CACHE_MAX_SIZE_MB:-1024}
      Logging__LogLevel__Default: ${LOG_LEVEL:-Information}
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "3140:80"
      # Self-signed HTTPS (issue #29): the Cache Storage API, required for offline viewing,
      # only exists in a secure context — see reverse-proxy/generate-cert.sh.
      - "${HTTPS_PORT:-3143}:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./reverse-proxy/locations.conf:/etc/nginx/locations.conf:ro
      - ./reverse-proxy/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # Real-time Docker log viewer (all containers on the host, not just this stack's) — direct
  # access on the port below, protected by the same network perimeter (VPN/LAN) as the rest
  # of the application, see ARCHITECTURE.md §2.
  logs:
    image: amir20/dozzle:latest
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # sqlite3 client for inspecting backend-data/cache.db directly while debugging — under a
  # dedicated profile ("debug") so it NEVER starts with a plain `docker compose up -d` (so no
  # extra container in prod via deploy.sh either, which activates no profile). Safe as a
  # concurrent reader: WAL mode (see issue #18) explicitly allows reads while a writer (the
  # backend) is active.
  # Usage: docker compose --profile debug up -d sqlite-cli
  #        docker exec -it rphotoalbum-sqlite-cli-1 sqlite3 /data/cache.db
  sqlite-cli:
    image: alpine:3.20
    profiles: ["debug"]
    command: sh -c "apk add --no-cache sqlite && tail -f /dev/null"
    volumes:
      - backend-data:/data
    restart: unless-stopped

volumes:
  backend-data:
