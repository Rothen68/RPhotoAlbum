# Shared between the two `server` blocks (HTTP and HTTPS) of nginx.conf via `include` — a single
# place to maintain rather than two diverging copies. $scheme automatically resolves to "http" or
# "https" depending on which server block served the request, so X-Forwarded-Proto stays correct
# with nothing to change here.

location /api/ {
    # No URI after the variable: Nginx forwards the original URI as-is (with the /api/ prefix,
    # which the backend expects) — see comment above.
    set $backend_upstream backend:8080;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Nginx's default (60s) became too short once /api/media/{id}/thumbnail proxies the
    # thumbnail's bytes directly instead of redirecting to pCloud (issue #26): before, only the
    # short getthumblink round-trip went through here, and the actual download happened directly
    # from the browser to pCloud's CDN, outside nginx's path. Set above the application-level
    # delay (MediaThumbnailCacheService.ThumbnailFetchTimeout) so that the latter always decides
    # first (a clean failure, 404) rather than nginx brutally cutting the connection before the
    # backend has finished.
    proxy_read_timeout 180s;
}

location / {
    set $frontend_upstream frontend:80;
    proxy_pass http://$frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
