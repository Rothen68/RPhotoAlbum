# Reverse proxy HTTP (v1). TLS à activer avant tout accès hors LAN de confiance :
# monter un certificat dans ./reverse-proxy/certs et ajouter un bloc `listen 443 ssl;`.
#
# resolver + variables dans proxy_pass : force Nginx à réévaluer l'IP de backend/frontend
# à chaque requête (résolveur DNS interne Docker) au lieu de la mettre en cache au démarrage,
# ce qui casserait le routage après recréation d'un conteneur (nouvelle IP).
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    location /api/ {
        # Sans URI après la variable : Nginx transmet l'URI d'origine telle quelle
        # (avec le préfixe /api/, que le backend attend) — voir commentaire ci-dessus.
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
