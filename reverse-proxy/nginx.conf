# Reverse proxy HTTP + HTTPS auto-signé (v2). Le port HTTP (80, mappé sur 3140) reste disponible
# tel quel pour compatibilité — aucune redirection automatique vers HTTPS ici : nginx ne connaît
# pas, depuis l'intérieur du conteneur, le port hôte que Docker mappe sur son propre 443, donc un
# redirect fiable n'est pas possible à ce niveau. HTTPS est un second point d'accès en parallèle,
# nécessaire pour la consultation hors-ligne (#29) : l'API Cache Storage du navigateur n'existe
# que dans un contexte sécurisé (HTTPS, ou http://localhost) — voir reverse-proxy/generate-cert.sh
# pour la génération du certificat auto-signé (LAN uniquement, pas de nom de domaine).
#
# resolver + variables dans proxy_pass (voir locations.conf) : force Nginx à réévaluer l'IP de
# backend/frontend à chaque requête (résolveur DNS interne Docker) au lieu de la mettre en cache
# au démarrage, ce qui casserait le routage après recréation d'un conteneur (nouvelle IP).
#
# ipv6=off : sur un hôte Docker avec IPv6 activé sur le réseau interne, le résolveur Docker
# (127.0.0.11) peut renvoyer une adresse IPv6 pour backend/frontend en plus de l'IPv4 — adresse
# non joignable dans ce réseau (constaté en usage réel : "connect() failed (111: Connection
# refused)" vers une adresse [fddX:...], 403 nginx local plutôt que 502, intermittent selon
# laquelle des deux adresses le résolveur renvoie en premier à chaque requête — jamais reproduit
# sur un hôte Docker sans IPv6 sur ce réseau, ce qui a longtemps masqué le problème). Force l'IPv4
# uniquement, seule adresse réellement joignable ici.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    include /etc/nginx/locations.conf;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    include /etc/nginx/locations.conf;
}
