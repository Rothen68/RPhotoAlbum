# HTTP + self-signed HTTPS reverse proxy (v2). The HTTP port (80, mapped to 3140) stays available
# as-is for compatibility — no automatic redirect to HTTPS here: nginx has no way, from inside
# the container, to know which host port Docker maps onto its own 443, so a reliable redirect
# isn't possible at this level. HTTPS is a second, parallel access point, required for offline
# viewing (#29): the browser's Cache Storage API only exists in a secure context (HTTPS, or
# http://localhost) — see reverse-proxy/generate-cert.sh for generating the self-signed
# certificate (LAN only, no domain name).
#
# resolver + variables in proxy_pass (see locations.conf): forces Nginx to re-resolve the IP of
# backend/frontend on every request (Docker's internal DNS resolver) instead of caching it at
# startup, which would break routing after a container is recreated (new IP).
#
# ipv6=off: on a Docker host with IPv6 enabled on the internal network, Docker's resolver
# (127.0.0.11) can return an IPv6 address for backend/frontend in addition to the IPv4 one — an
# address unreachable on this network (observed in real usage: "connect() failed (111: Connection
# refused)" toward a [fddX:...] address, a local 403 from nginx rather than a 502, intermittent
# depending on which of the two addresses the resolver returns first on each request — never
# reproduced on a Docker host without IPv6 on this network, which long masked the problem).
# Forces IPv4 only, the only address actually reachable here.
resolver 127.0.0.11 valid=10s ipv6=off;

# Basic security headers, at the server level (not in locations.conf): an add_header inside a
# location would disable inheritance from the parent, whereas here we want the same headers on
# both /api/ and / without duplicating them. `always`: also applied on error responses
# (401/403/502).
# No CSP here: would require precisely auditing the inline styles/scripts of the Angular build,
# risking breaking the app for marginal gain on a LAN/VPN deployment that isn't publicly exposed.
server {
    listen 80;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    include /etc/nginx/locations.conf;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    include /etc/nginx/locations.conf;
}
